name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python-version }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        deps: [core, g2p]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The core install is numpy-only on purpose: the phonetic constraint, the
      # index, the gate and the CLI must work with nothing else installed. The
      # "core" leg of this matrix is what proves that claim on every push.
      - name: Install (core only)
        if: matrix.deps == 'core'
        run: pip install -e ".[dev]"

      - name: Install (with Japanese G2P)
        if: matrix.deps == 'g2p'
        run: pip install -e ".[dev]" fugashi unidic-lite

      - name: Report which backends are active
        run: python -m mondegreen.cli info

      - name: Tests
        run: pytest tests/ -q

      - name: Invariants (the tests that guard a claim)
        run: pytest tests/ -q -m invariant

      - name: CLI smoke test
        run: |
          printf '進藤さんが両氏誤り訂正の話をしました。\n' > /tmp/t.txt
          printf 'surface,reading\n新藤,シンドウ\n量子誤り訂正,リョウシアヤマリテイセイ\n' > /tmp/g.csv
          python -m mondegreen.cli fix /tmp/t.txt --glossary /tmp/g.csv -q > /tmp/out.txt
          cat /tmp/out.txt
          grep -q '新藤さんが量子誤り訂正の話をしました。' /tmp/out.txt

      - name: Harmlessness — empty glossary must be the identity
        run: |
          printf '今日はいい天気ですね。\n' > /tmp/clean.txt
          python -m mondegreen.cli fix /tmp/clean.txt -q > /tmp/clean_out.txt
          diff /tmp/clean.txt /tmp/clean_out.txt

  benchmark:
    name: end-to-end benchmark (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" fugashi unidic-lite
      - name: Harvest -> gate -> sweep
        run: |
          python scripts/harvest_errors.py --mode simulated -n 120 \
            --glossary-size 300 --test-glossary-size 100 --out /tmp/data
          python -m mondegreen.cli train-gate --pairs /tmp/data/pairs.jsonl \
            --glossary /tmp/data/glossary_train.csv -o /tmp/data/gate.json
          python -m mondegreen.cli sweep --pairs /tmp/data/pairs.jsonl \
            --glossary /tmp/data/glossary_test.csv --gate /tmp/data/gate.json
      - name: Conditions (A)-(E), small
        run: |
          python scripts/run_benchmarks.py -n 60 --glossary-sizes 30 300 \
            --control-sizes 100 --train-sentences 120 --out /tmp/results
